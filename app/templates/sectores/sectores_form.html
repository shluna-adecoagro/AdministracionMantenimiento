{% extends "layout.html" %}

{% block content %}

<div class="form-container">

    <h2 class="form-title">{{ titulo }}</h2>

    <form method="POST" id="form-sector">

        {% for campo, cfg in config.fields.items() %}

            <div class="form-group">
                <label for="{{ campo }}">{{ cfg.label }}</label>

                {% if cfg.tipo == "text" %}
                    <input
                        type="text"
                        name="{{ campo }}"
                        id="{{ campo }}"
                        value="{{ modelo.get(campo, '') }}"
                        {% if cfg.required %}required{% endif %}
                    >

                {% elif cfg.tipo == "select" %}
                    <select name="{{ campo }}" id="{{ campo }}">
                        {% for opt in cfg.options %}
                            <option value="{{ opt.value }}"
                                {% if modelo.get(campo) == opt.value %}selected{% endif %}
                            >
                                {{ opt.label }}
                            </option>
                        {% endfor %}
                    </select>
                {% endif %}
            </div>

        {% endfor %}

        <div class="form-actions">
            <button type="button" class="btn-primary"
                onclick="abrirModalMotivo('{{ tipo_operacion }}', document.getElementById('form-sector'))">
                {{ texto_boton }}
            </button>
            <a href="/sectores" class="btn-secondary">Cancelar</a>
        </div>

    </form>

</div>

{% endblock %}

# Entorno conda del proyecto (Miniforge / conda-forge).
#
#   conda env create -f environment.yml     # crear
#   conda env update -f environment.yml --prune   # actualizar tras un cambio acá
#   conda activate adminmant
#
# Mantener sincronizado con requirements.txt / requirements-dev.txt (un test lo
# verifica). Sin versiones exactas ni builds: así funciona en cualquier máquina.
name: adminmant
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Aplicación (requirements.txt)
  - flask
  - flask-sqlalchemy
  - flask-migrate
  - flask-cors
  - python-dotenv
  - jsonschema
  # Desarrollo y tests (requirements-dev.txt)
  - pytest
  - openapi-spec-validator
  # Análisis (ml/)
  - pandas
  - numpy
  - matplotlib
